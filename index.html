
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Central</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Biblioteca Central</h1>
        <p>Sistema de registro de acervo</p>
    </header>

    <main>
        <section class="introducao">
            <p class="categoria">GERENCIAMENTO DO ACERVO</p>
            <h2>Cadastro de livros</h2>
            <p>Registre novas aquisições para a biblioteca.</p>
        </section>

        <section class="cartao">
            <h3>Dados do livro</h3>
            <p class="descricao">
                Preencha as informações abaixo para cadastrar um livro.
            </p>

            <form>
                <label for="codigo">Código do livro</label>
                <input type="number" 
                       placeholder="Digite o código">

                <label for="titulo">Título do livro</label>
                <input type="text" 
                       placeholder="Digite o título">

                <label for="autor">Nome do autor</label>
                <input type="text" 
                       placeholder="Digite o nome do autor">

                <label for="ano">Ano de publicação</label>
                <input type="number" 
                       placeholder="Digite o ano">

                <button type="button">Salvar livro</button>
            </form>
        </section>

        <footer>
            Biblioteca Central © 2026
        </footer>
    </main>

</body>
</html>
